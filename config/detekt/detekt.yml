# detekt for Orbit (PLAN 8): default rules plus Compose rules, tuned to the project's style.
# Report only – CI never fails on findings. Altbestand lives in baseline.xml.
config:
  # Unknown keys (detekt 2 renames) must never stop the report.
  validation: false

build:
  maxIssues: -1

style:
  MaxLineLength:
    maxLineLength: 200
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: false

# Compose rules (io.nlopez.compose.rules) – each rule is off unless listed here.
Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ComposableParamOrder:
    active: true
  CompositionLocalNaming:
    active: true
  ContentEmitterReturningValues:
    active: true
  ContentTrailingLambda:
    active: true
  ContentSlotReused:
    active: true
  DefaultsVisibility:
    active: true
  LambdaParameterEventTrailing:
    active: true
  LambdaParameterInRestartableEffect:
    active: true
  ModifierClickableOrder:
    active: true
  ModifierComposed:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  MutableStateAutoboxing:
    active: true
  MutableStateParam:
    active: true
  ParameterNaming:
    active: true
  PreviewAnnotationNaming:
    active: true
  PreviewPublic:
    active: true
  RememberMissing:
    active: true
  RememberContentMissing:
    active: true
  CompositionLocalAllowlist:
    active: true
    allowedCompositionLocals: LocalSharedScope
  Material2:
    active: false
  ViewModelForwarding:
    active: false
  ViewModelInjection:
    active: false
