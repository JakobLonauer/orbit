name: Build Orbit APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbit-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        id: signing
        env:
          ORBIT_SIGNING_PASSWORD: ${{ secrets.ORBIT_SIGNING_PASSWORD }}
        run: |
          if [ -n "$ORBIT_SIGNING_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in signing/orbit.jks.enc -out "$RUNNER_TEMP/orbit.jks" -pass env:ORBIT_SIGNING_PASSWORD
            {
              echo "ORBIT_KEYSTORE_PATH=$RUNNER_TEMP/orbit.jks"
              echo "ORBIT_KEY_ALIAS=orbit"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the Orbit release key."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret ORBIT_SIGNING_PASSWORD fehlt - Test-Build ohne Release."
          fi

      - name: Build release APK
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_SIGNING_PASSWORD }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease -PorbitVersionCode=${{ github.run_number }} 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show compiler errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -300 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Orbit-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-apk
          path: out/*.apk

      - name: Publish release
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" out/*.apk \
            --title "Orbit 1.0.${{ github.run_number }}" \
            --notes "Auf dem Handy die APK unten unter Assets antippen, herunterladen und öffnen." \
            --latest
