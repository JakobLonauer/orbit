name: Build Orbit APK

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbit-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        id: signing
        env:
          ORBIT_SIGNING_PASSWORD: ${{ secrets.ORBIT_SIGNING_PASSWORD }}
        run: |
          if [ -n "$ORBIT_SIGNING_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in signing/orbit.jks.enc -out "$RUNNER_TEMP/orbit.jks" -pass env:ORBIT_SIGNING_PASSWORD
            {
              echo "ORBIT_KEYSTORE_PATH=$RUNNER_TEMP/orbit.jks"
              echo "ORBIT_KEY_ALIAS=orbit"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the Orbit release key."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret ORBIT_SIGNING_PASSWORD fehlt - Test-Build ohne Release."
          fi

      - name: Build release APK
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_SIGNING_PASSWORD }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          # Tests and screenshots first; --continue so one CI round reports every failure.
          ./gradlew --no-daemon --stacktrace --continue \
            :core:model:test :core:domain:test :app:recordRoborazziDebug assembleRelease \
            -PorbitVersionCode=${{ github.run_number }} 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show compiler errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -300 || true

      # PLAN 8: detekt (with Compose rules) and Android Lint as reports only – never block a build or a release.
      - name: Static analysis (report only)
        if: success()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/analysis"
          ./gradlew --no-daemon --continue :app:lintDebug -PorbitVersionCode=${{ github.run_number }} > "$RUNNER_TEMP/analysis/lint.log" 2>&1 || true
          cp app/build/reports/lint/lint.txt "$RUNNER_TEMP/analysis/lint.txt" 2>/dev/null || true
          DETEKT=2.0.0-alpha.6
          curl -fsSL -o detekt.jar "https://github.com/detekt/detekt/releases/download/v$DETEKT/detekt-cli-$DETEKT-all.jar" || echo "detekt download failed" >> "$RUNNER_TEMP/analysis/detekt.log"
          # Compose rules plus their own modules from the same group (read from the POM).
          CR=0.6.6; CRBASE=https://repo1.maven.org/maven2/io/nlopez/compose/rules
          PLUGS=""
          if curl -fsSL -o cr.pom "$CRBASE/detekt/$CR/detekt-$CR.pom"; then
            for a in detekt $(python3 -c "import re,sys; t=open('cr.pom').read(); print(' '.join(sorted({m for g,m in re.findall(r'<groupId>([^<]+)</groupId>\\s*<artifactId>([^<]+)</artifactId>', t) if g=='io.nlopez.compose.rules'})))"); do
              curl -fsSL -o "cr-$a.jar" "$CRBASE/$a/$CR/$a-$CR.jar" && PLUGS="$PLUGS:cr-$a.jar" || echo "compose rules: $a missing" >> "$RUNNER_TEMP/analysis/detekt.log"
            done
          else
            echo "compose rules download failed" >> "$RUNNER_TEMP/analysis/detekt.log"
          fi
          INPUTS="--input app/src/main/java:core/model/src/main:core/domain/src/main:core/designsystem/src/main"
          if [ -f detekt.jar ]; then
            PLUG=""; [ -n "$PLUGS" ] && PLUG="--plugins ${PLUGS#:}"
            BASE=""; [ -f config/detekt/baseline.xml ] && BASE="--baseline config/detekt/baseline.xml"
            java -jar detekt.jar $INPUTS \
              --build-upon-default-config --config config/detekt/detekt.yml $PLUG $BASE \
              --report md:"$RUNNER_TEMP/analysis/detekt.md" --report checkstyle:"$RUNNER_TEMP/analysis/detekt.xml" \
              >> "$RUNNER_TEMP/analysis/detekt.log" 2>&1 || true
            # Compose rules not loadable: the plain rules still give a report.
            if [ ! -s "$RUNNER_TEMP/analysis/detekt.md" ] && [ -n "$PLUG" ]; then
              echo "retry without compose rules" >> "$RUNNER_TEMP/analysis/detekt.log"; PLUG=""
              java -jar detekt.jar $INPUTS --build-upon-default-config --config config/detekt/detekt.yml $BASE \
                --report md:"$RUNNER_TEMP/analysis/detekt.md" --report checkstyle:"$RUNNER_TEMP/analysis/detekt.xml" \
                >> "$RUNNER_TEMP/analysis/detekt.log" 2>&1 || true
            fi
            # A baseline of today's findings, to commit as config/detekt/baseline.xml (only new findings count afterwards).
            [ -z "$BASE" ] && java -jar detekt.jar $INPUTS \
              --build-upon-default-config --config config/detekt/detekt.yml $PLUG \
              --create-baseline --baseline "$RUNNER_TEMP/analysis/baseline.xml" >> "$RUNNER_TEMP/analysis/detekt.log" 2>&1 || true
          fi
          tail -c 20000 "$RUNNER_TEMP/analysis/detekt.log" > "$RUNNER_TEMP/analysis/detekt.log.tail" 2>/dev/null || true

      - name: Publish build log to ci-log branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/cilog"
          cp build.log "$RUNNER_TEMP/cilog/build.log" 2>/dev/null || echo "no build log" > "$RUNNER_TEMP/cilog/build.log"
          cd "$RUNNER_TEMP/cilog"
          grep -E "^e: |error:|FAILURE|What went wrong|Could not|Execution failed| FAILED$" -A6 build.log > errors.txt || true
          mkdir -p shots tests
          cp "$GITHUB_WORKSPACE"/app/build/outputs/roborazzi/*.png shots/ 2>/dev/null || true
          find "$GITHUB_WORKSPACE" -path "*/build/test-results/*" -name "TEST-*.xml" -exec cp {} tests/ \; 2>/dev/null || true
          grep -l "<failure" tests/*.xml > tests/failed.txt 2>/dev/null || true
          mkdir -p analysis
          cp "$RUNNER_TEMP"/analysis/lint.txt "$RUNNER_TEMP"/analysis/detekt.md "$RUNNER_TEMP"/analysis/detekt.xml "$RUNNER_TEMP"/analysis/baseline.xml analysis/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/analysis/detekt.log.tail analysis/detekt.log 2>/dev/null || true
          tail -c 20000 "$RUNNER_TEMP"/analysis/lint.log > analysis/lint.log 2>/dev/null || true
          echo "run ${{ github.run_number }} sha ${{ github.sha }} outcome ${{ job.status }}" > meta.txt
          if [ "$GITHUB_REF_NAME" = "main" ]; then LOGBRANCH=ci-log; else LOGBRANCH="ci-log-$GITHUB_REF_NAME"; fi
          echo "branch $GITHUB_REF_NAME" >> meta.txt
          git init -q -b "$LOGBRANCH"
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "build log run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$LOGBRANCH"

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Orbit-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-apk
          path: out/*.apk

      - name: Publish release
        if: steps.signing.outputs.signed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" out/*.apk \
            --title "Orbit 1.0.${{ github.run_number }}" \
            --notes "Auf dem Handy die APK unten unter Assets antippen, herunterladen und öffnen." \
            --latest
